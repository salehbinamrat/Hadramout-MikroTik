name: Windows Release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    name: Windows Release
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Tests then package and verify installation
        shell: pwsh
        run: ./packaging/verify-and-package.ps1
      - name: Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hadramout-windows-foundation
          path: artifacts/release/*
          if-no-files-found: error
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
      - name: Smoke stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-evidence
          path: artifacts/smoke-evidence/*.log
          if-no-files-found: warn
