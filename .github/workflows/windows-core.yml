name: Windows Core
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: Windows Core
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Hadramout.slnx
      - name: Build
        run: dotnet build Hadramout.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Hadramout.slnx -c Release --no-build --logger trx
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
